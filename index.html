<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập chữ Hán – Bài 10 đến 14</title>
<style>
:root{
  --paper:#F6F8F5; --surface:#FFFFFF; --ink:#1E2433; --muted:#5B6577;
  --red:#C21F2F; --red-deep:#961622; --bamboo:#2E7D4F; --bamboo-soft:#E3F1E8;
  --gold:#E9B52B; --line:#D9DED8;
  --zh:"KaiTi","STKaiti","Kaiti SC","楷体","BiauKai",serif;
  --vi:"Times New Roman",Times,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#141A17;--surface:#1D2420;--ink:#ECEFEA;--muted:#A7B0AA;--red:#E0414F;--red-deep:#B52A37;
  --bamboo:#5DBB84;--bamboo-soft:#1F3A2A;--gold:#F0C552;--line:#33403A;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--vi);font-size:19px;line-height:1.45}
.zh{font-family:var(--zh)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.show{display:flex}
.band{background:var(--red);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.band h1{margin:0;font-size:clamp(20px,2.4vw,28px)}
.band h1 .zh{font-size:1.15em;margin-right:10px}
.band button{background:transparent;border:2px solid rgba(255,255,255,.7);border-radius:8px;padding:6px 14px;color:#fff}

/* welcome */
#welcome{align-items:center;justify-content:center;padding:24px}
.hello{background:var(--surface);border-top:8px solid var(--red);border-radius:16px;padding:32px 36px;width:min(560px,100%);text-align:center}
.hello .big{font-family:var(--zh);font-size:clamp(64px,10vw,104px);color:var(--red);line-height:1.1;margin:0}
.hello .py{font-style:italic;color:var(--muted);margin:0 0 18px}
.hello label{display:block;font-size:26px;font-weight:700;margin-bottom:10px}
.hello input{width:100%;font-size:26px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--paper);text-align:center}
.hello .err{color:var(--red);min-height:1.4em;margin:6px 0 0;font-size:17px}
.primary{border:none;background:var(--red);color:#fff;border-radius:12px;padding:12px 28px;font-weight:700;font-size:22px;margin-top:8px}
.primary:hover{background:var(--red-deep)}
.hello .src{color:var(--muted);font-size:16px;margin:18px 0 0}

/* menu */
.menu{flex:1;padding:28px 24px;max-width:1100px;width:100%;margin:0 auto}
.greet{font-size:clamp(26px,3vw,36px);margin:4px 0 4px}
.greet .zh{color:var(--red)}
.sub{color:var(--muted);margin:0 0 24px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.game{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0;overflow:hidden;transition:transform .12s ease,border-color .12s}
.game:hover{transform:translateY(-3px);border-color:var(--bamboo)}
.game .art{background:var(--bamboo);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 16px;font-family:var(--zh);font-size:clamp(44px,6vw,70px)}
.game:nth-child(2) .art{background:var(--red)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini span{width:56px;height:42px;border-radius:6px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;font-family:var(--vi);font-weight:700}
.mini.cards span{background:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 7px,rgba(255,255,255,.1) 7px 14px)}
.mini.cards span.up{background:#fff;color:var(--red);font-family:var(--zh)}
.game .body{padding:18px 22px 22px}
.game h2{margin:0 0 4px;font-size:26px}
.game h2 .zh{color:var(--red);margin-right:8px}
.game p{margin:6px 0 0;color:var(--muted);font-size:18px}
.game .go{display:inline-block;margin-top:14px;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 18px;font-weight:700}
.change{background:none;border:none;color:var(--muted);text-decoration:underline;padding:0;margin-top:22px;font-size:17px}

/* frame */
#play{position:fixed;inset:0;display:none;background:var(--paper)}
#play.show{display:block}
#play iframe{width:100%;height:100%;border:0;display:block}

@media (max-width:760px){.games{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="screen show" id="welcome">
  <form class="hello" id="nameForm" autocomplete="off">
    <p class="big">你好！</p>
    <p class="py">Nǐ hǎo! Chào mừng bạn đến buổi ôn tập</p>
    <label for="nameIn">Bạn tên là…</label>
    <input id="nameIn" maxlength="24" placeholder="Nhập tên của bạn">
    <p class="err" id="nameErr" aria-live="polite"></p>
    <button class="primary" type="submit">Vào chơi</button>
  </form>
</section>

<section class="screen" id="menu">
  <div class="band"><h1><span class="zh">复习</span>Ôn tập chữ Hán, bài 10 đến 14</h1></div>
  <div class="menu">
    <p class="greet"><span class="zh">你好</span>, <b id="who"></b>!</p>
    <p class="sub">Hôm nay mình chơi game nào trước?</p>
    <div class="games">
      <button class="game" type="button" data-g="1">
        <div class="art"><div class="mini"><span>100</span><span>200</span><span>300</span><span>200</span><span>300</span><span>400</span></div></div>
        <div class="body">
          <h2><span class="zh">温故知新</span>Bảng thử thách</h2>
          <p>Chọn ô điểm theo từng bài. Nhìn chữ chọn nghĩa, tìm đúng mặt chữ, chọn phiên âm và đọc câu trong bài khóa.</p>
          <span class="go">Chơi game 1</span>
        </div>
      </button>
      <button class="game" type="button" data-g="2">
        <div class="art"><div class="mini cards"><span class="up">冷</span><span></span><span></span><span></span><span class="up">买</span><span></span></div></div>
        <div class="body">
          <h2><span class="zh">翻牌配对</span>Lật thẻ ghép đôi</h2>
          <p>Lật hai thẻ, tìm chữ Hán khớp với nghĩa hoặc phiên âm. Đọc to chữ trước khi lật thẻ thứ hai.</p>
          <span class="go">Chơi game 2</span>
        </div>
      </button>
    </div>
    <button class="change" type="button" id="btnChange">Đổi tên người chơi</button>
  </div>
</section>

<div id="play"></div>

const $=id=>document.getElementById(id);
let player="";
function decode(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("show",s.id===id))}
try{player=localStorage.getItem("anfa-player")||""}catch(e){}
$("nameIn").value=player;
$("nameForm").onsubmit=e=>{
  e.preventDefault();
  const v=$("nameIn").value.trim();
  if(!v){$("nameErr").textContent="Bạn hãy nhập tên để bắt đầu nhé.";$("nameIn").focus();return}
  player=v;$("nameErr").textContent="";
  try{localStorage.setItem("anfa-player",v)}catch(e){}
  $("who").textContent=player;show("menu");
  document.querySelector(".game").focus();
};
$("btnChange").onclick=()=>{show("welcome");$("nameIn").select()};
document.querySelectorAll(".game").forEach(b=>b.onclick=()=>openGame(b.dataset.g));
function openGame(g){
  const html=decode(SRC[g]).replace("<head>","<head><script>window.PLAYER_NAME="+JSON.stringify(player).replace(/</g,"\\u003c")+";<\/script>");
  const f=document.createElement("iframe");f.title=g==="1"?"Bảng thử thách":"Lật thẻ ghép đôi";f.allow="autoplay";
  f.srcdoc=html;
  const p=$("play");p.innerHTML="";p.appendChild(f);p.classList.add("show");
  f.onload=()=>{try{f.contentWindow.focus()}catch(e){}};
}
addEventListener("message",e=>{
  if(e.data==="anfa-home"){$("play").classList.remove("show");$("play").innerHTML="";show("menu")}
});
$("nameIn").focus();
</script>
</body>
